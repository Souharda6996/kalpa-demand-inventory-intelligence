[project]
name = "kalpa-worker"
version = "0.1.0"
description = "Kalpa ARQ background worker"
requires-python = ">=3.12"
dependencies = [
  "arq>=0.26",
  "redis>=5.2",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "kalpa-api",
  "kalpa-ml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kalpa_worker"]

[tool.uv.sources]
kalpa-api = { workspace = true }
kalpa-ml = { workspace = true }
