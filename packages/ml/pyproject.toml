[project]
name = "kalpa-ml"
version = "0.1.0"
description = "Kalpa ML package (features, backtest, models, policy)"
requires-python = ">=3.12"
dependencies = [
    "hierarchicalforecast>=1.5.3",
    "holidays>=0.109",
    "lightgbm>=4.7.0",
    "mlflow-skinny>=3.18.0",
    "mlforecast>=1.1.0",
    "numpy>=2.0",
    "pandas>=2.3.3",
    "pandera>=0.36.0",
    "polars>=1.12",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "statsforecast>=2.1.1",
    "torch>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kalpa_ml"]
