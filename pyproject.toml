[project]
name = "kalpa"
version = "0.1.0"
description = "Kalpa - Demand & Inventory Intelligence (workspace root)"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["services/api", "services/worker", "packages/ml"]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "pre-commit>=4.0",
  "fakeredis>=2.40.0",
  "pytest-cov>=7.1.0",
  "hypothesis>=6.170.17",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["**/alembic/versions", "data"]

[tool.ruff.lint.isort]
known-first-party = ["kalpa_api", "kalpa_ml", "kalpa_worker"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "E501"]
"**/synth.py" = ["E501"]
"**/scripts/**" = ["ASYNC240"]
"scripts/**" = ["E501", "E401", "S105", "F541"]  # CLI helpers: long prints, throwaway demo passwords

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "services/api:services/worker:packages/ml"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["services/api/tests", "services/worker/tests", "packages/ml/tests"]

[tool.coverage.run]
# SQLAlchemy's async layer runs query code inside greenlets; without this, everything after the first await is untraced.
concurrency = ["greenlet", "thread"]
