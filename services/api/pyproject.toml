[project]
name = "kalpa-api"
version = "0.1.0"
description = "Kalpa FastAPI service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "structlog>=24.4",
  "python-multipart>=0.0.34",
  "rapidfuzz>=3.14.6",
  "pandera[polars]>=0.36.0",
  "polars>=2.1.0",
  "kalpa-ml",
  "argon2-cffi>=25.1.0",
  "pyjwt>=2.15.1",
  "email-validator>=2.4.0",
  "tzdata>=2026.6",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kalpa_api"]

[tool.uv.sources]
kalpa-ml = { workspace = true }

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pandera>=0.36.0",
    "polars>=2.1.0",
    "python-multipart>=0.0.34",
    "rapidfuzz>=3.14.6",
]
